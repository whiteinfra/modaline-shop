# CI: перевірка стилю, тести на PostgreSQL і збірка Docker-образу з перевіркою /api/health
name: CI

on:
  push:
    branches: [main, develop, "feature/**", "release/**", "hotfix/**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.8
      - name: ruff check
        run: ruff check backend
      - name: ruff format --check
        run: ruff format --check backend

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
          POSTGRES_DB: modaline_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shop -d modaline_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://shop:shop@localhost:5432/modaline_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: pytest (PostgreSQL 16)
        working-directory: backend
        run: python -m pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: docker compose up
        run: docker compose up -d --build
      - name: Очікування /api/health
        run: |
          for i in $(seq 1 40); do
            if curl -fs http://localhost:8000/api/health; then echo; exit 0; fi
            sleep 3
          done
          docker compose logs api
          exit 1
      - name: Smoke-тест API
        run: |
          curl -fs "http://localhost:8000/api/products?limit=3" | head -c 400; echo
          curl -fs -o /dev/null -w "frontend: HTTP %{http_code}\n" http://localhost:8000/
      - name: docker compose down
        if: always()
        run: docker compose down -v
